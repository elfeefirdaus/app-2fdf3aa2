*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<script id="fee-core">
/* ==========================================================================
   FeeCore — pure calculation, validation and migration logic.
   No DOM access. Extracted and unit-tested by tests/core.test.js.
   All money maths is done in integer cents to avoid floating-point drift.
   ========================================================================== */
var FeeCore=(function(){
"use strict";
var KEY='feeFinance.v1', SCHEMA=2;
var TX_TYPES=['expense','income','transfer','debt','bill','saving'];
var TYPE_LABEL={expense:'Expense',income:'Income',transfer:'Transfer',debt:'Debt payment',bill:'Bill payment',saving:'Savings',unknown:'Unknown'};

/* ---------- money ---------- */
function r2(n){n=+n;if(!isFinite(n))return 0;var s=n<0?-1:1,a=Math.abs(n);if(a<0.005)return 0;
  var str=String(a);if(/e/i.test(str))return s*Math.round(a*100)/100;return s*Number(Math.round(Number(str+'e2'))+'e-2')}

function sumC(arr,f){return arr.reduce(function(a,x){return a+cents(f?f(x):x)},0)}
/* Parse a user-typed amount. Accepts "1,234.50", "S$12", "12.3". Max 2 dp. */
function parseAmount(v,opt){opt=opt||{};
  if(typeof v==='number'){if(!isFinite(v))return {ok:false,error:'Enter a number'};v=String(v)}
  var s=String(v==null?'':v).replace(/S\$|\$|,|\s/gi,'');

  if(!/^-?\d+(\.\d+)?$/.test(s))return {ok:false,error:'Use numbers only, e.g. 12.50'};
  if(/\.\d{3,}$/.test(s))return {ok:false,error:'Use at most 2 decimal places'};
  var n=r2(parseFloat(s));
  if(n===0)return {ok:false,error:'Amount must be more than S$0'};
  if(n<0&&!opt.allowNegative)return {ok:false,error:'Amount cannot be negative'};
  if(Math.abs(n)>(opt.max||10000000))return {ok:false,error:'That amount looks too large'};
  return {ok:true,value:n};

/* ---------- dates (ISO yyyy-mm-dd, calendar maths in UTC days) ---------- */
function pad(n){return (n<10?'0':'')+n}
function dim(y,m0){return new Date(Date.UTC(y,m0+1,0)).getUTCDate()}
function isISO(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;
  var y=+s.slice(0,4),m=+s.slice(5,7),d=+s.slice(8,10);return y>=1970&&y<=2100&&m>=1&&m<=12&&d>=1&&d<=dim(y,m-1)}

function toDays(s){return Math.round(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5)}
function fromDays(n){var d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}

function daysBetween(a,b){return toDays(b)-toDays(a)}
function ymOf(s){return String(s).slice(0,7)}
function monthAdd(ym,n){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+pad(m+1)}

/* Due date for a "day of month" — clamps 31 to the last day of short months. */
function dueDate(ym,day){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1;day=Math.max(1,Math.min(31,parseInt(day,10)||1));return ym+'-'+pad(Math.min(day,dim(y,m)))}

function monthsBetween(a,b){return (+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7))}

/* ---------- classification ---------- */
/* Legacy v1 recorded ticked non-debt recurring bills (e.g. a monthly bill) as type

   reclassify at read time only; stored records are never rewritten. */
function classify(t){if(!t||typeof t!=='object')return 'unknown';var ty=t.type;
  if(ty==='debt'&&!t.debtId)return 'bill';return TX_TYPES.indexOf(ty)>=0?ty:'unknown'}
function txErrors(t){var e=[];if(!t||typeof t!=='object'){return ['Not a record']}
  if(TX_TYPES.indexOf(t.type)<0)e.push('Unknown type "'+t.type+'"');
  var a=+t.amount;if(typeof t.amount==='boolean'||t.amount===''||t.amount==null||!isFinite(a))e.push('Amount is not a number');
  else if(a===0)e.push('Amount is zero');else if(a<0&&t.type!=='saving')e.push('Negative amount');
  else if(Math.abs(a)>10000000)e.push('Amount too large');

  if(t.type==='transfer'&&(!t.fromAccount||!t.toAccount||t.fromAccount===t.toAccount))e.push('Transfer needs two different accounts');
  return e}
function isValidTx(t){return txErrors(t).length===0}
function validTxs(state){return (state&&Array.isArray(state.tx)?state.tx:[]).filter(isValidTx)}
function byDate(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)}
function txPeriod(t){return isYM(t.period)?t.period:ymOf(t.date)}
function normNote(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
/* Same type, amount, date, category/debt and note = probable duplicate. */
function fingerprint(t){return [classify(t),cents(t.amount),t.date,t.category||'',t.debtId||'',t.recurringId||'',normNote(t.note)].join('|')}

/* Report-friendly monthly totals. Debt payments, savings and internal transfers
   are NOT expenses; card-paid purchases are expenses once (the card repayment
   is a debt payment), so nothing is counted twice. */
function monthSummary(state,ym){var tx=validTxs(state).filter(function(t){return ymOf(t.date)===ym});
  var o={income:0,expense:0,bill:0,debt:0,saving:0,transfer:0,byCategory:{},count:tx.length,cardExpense:0};
  tx.forEach(function(t){var c=classify(t),a=cents(t.amount);if(c==='unknown')return;o[c]+=a;
    if(c==='expense'){var k=t.category||'Other';o.byCategory[k]=(o.byCategory[k]||0)+a;if(t.paidWith==='card')o.cardExpense+=a}});
  var r={};for(var k in o){if(k==='byCategory'){r.byCategory={};for(var q in o.byCategory)r.byCategory[q]=fromCents(o.byCategory[q])}else if(k==='count')r.count=o.count;else r[k]=fromCents(o[k])}

  return r}

/* ---------- accounts / recorded cash ---------- */
function mainAccountId(state){return state.accounts&&state.accounts[0]?state.accounts[0].id:'main'}
function cashDelta(t,acctId,mainId){var c=classify(t),a=cents(t.amount),acc=t.account||mainId;
  if(c==='transfer'){var d=0;if(t.fromAccount===acctId)d-=a;if(t.toAccount===acctId)d+=a;return d}
  if(acc!==acctId)return 0;
  if(c==='income')return a;if(c==='expense')return t.paidWith==='card'?0:-a;
  if(c==='bill'||c==='debt'||c==='saving')return -a;return 0}
/* The balance the user typed is the truth at the moment it was entered (asOf day + setTs time).
   Only entries after that moment adjust it: dated after the as-of day, or dated that same day and
   logged after the balance was typed, unless marked "already included" (inBalance). Entries dated
   before the as-of day are already reflected in it. Future-dated entries count once their day comes. */
function countsAfterBalance(t,a,today){if(today&&t.date>today)return false;if(t.date>a.asOf)return true;
  return t.date===a.asOf&&(t.ts||0)>(a.setTs||0)&&t.inBalance!==true}
/* Entries that do NOT adjust the balance even though they were logged after it was typed. */
function coveredByBalance(state,a){return validTxs(state).filter(function(t){return a&&isISO(a.asOf)&&(t.ts||0)>(a.setTs||0)&&!countsAfterBalance(t,a,null)&&cashDelta(t,a.id,mainAccountId(state))!==0})}
/* Record a balance the user just typed: it becomes the source of truth as of now. */
function enterBalance(a,value,todayISO,nowTs,asOf){a.balance=value==null?null:r2(value);a.asOf=value==null?null:(isISO(asOf)?asOf:todayISO);a.setTs=value==null?null:nowTs;return a}
/* Balance the user typed (as of a date) + every valid transaction recorded after it, up to today. */
function cashPosition(state,today){var mainId=mainAccountId(state),tx=validTxs(state),accts=[],tot=0,known=false;
  (state.accounts||[]).forEach(function(a){var set=a.balance!=null&&a.balance!==''&&isFinite(+a.balance)&&isISO(a.asOf);
    if(!set){accts.push({id:a.id,name:a.name,set:false});return}
    var c=cents(a.balance);tx.forEach(function(t){if(countsAfterBalance(t,a,today))c+=cashDelta(t,a.id,mainId)});
    known=true;tot+=c;accts.push({id:a.id,name:a.name,set:true,entered:r2(a.balance),asOf:a.asOf,current:fromCents(c)})});
  return {known:known,total:known?fromCents(tot):null,accounts:accts}}

/* ---------- loans ---------- */
/* Counted from debt.from; a payment made early for an instalment on/after that month (t.period) also counts. */
function debtPayments(state,d){var f=d.from||'0000-00-00';return validTxs(state).filter(function(t){return classify(t)==='debt'&&t.debtId===d.id&&(t.date>=f||(isYM(t.period)&&t.period>=ymOf(f)))}).sort(byDate)}
/* Allocate payments, oldest first, against a contractual schedule: each
   instalment's interest first, then its principal. Payments beyond the
   schedule are reported as unallocated overpayment. */
function allocateSchedule(schedule,payments,asOf){
  var rows=(schedule||[]).map(function(r){var P=cents(r[1]),I=cents(r[2]);return {due:r[0],principal:P,interest:I,total:P+I,listedTotal:cents(r[3]),pI:0,pP:0,paidOn:null,parts:[]}}).sort(function(a,b){return a.due<b.due?-1:1});
  var i=0,over=0,log=[];
  (payments||[]).slice().sort(byDate).forEach(function(p){var rem=cents(p.amount),parts=[];
    while(rem>0&&i<rows.length){var r=rows[i],nI=r.interest-r.pI,nP=r.principal-r.pP;
      var aI=Math.min(rem,nI);r.pI+=aI;rem-=aI;var aP=Math.min(rem,nP);r.pP+=aP;rem-=aP;
      if(aI||aP){parts.push({due:r.due,interest:fromCents(aI),principal:fromCents(aP)});r.parts.push({date:p.date,id:p.id,interest:fromCents(aI),principal:fromCents(aP)})}

    if(rem>0){over+=rem;parts.push({due:null,overpaid:fromCents(rem)})}
    log.push({id:p.id,date:p.date,amount:r2(p.amount),parts:parts})});
  var sP=0,sI=0,pP=0,pI=0,overdue=0,overdueI=0,next=null,inconsistent=0;
  var out=rows.map(function(r){sP+=r.principal;sI+=r.interest;pP+=r.pP;pI+=r.pI;var paid=r.pP+r.pI,left=r.total-paid;
    if(r.total!==r.listedTotal)inconsistent++;

    if(st==='overdue'){overdue+=left;overdueI+=r.interest-r.pI}
    if(st!=='paid'&&!next)next=r;
    return {due:r.due,principal:fromCents(r.principal),interest:fromCents(r.interest),total:fromCents(r.total),paidPrincipal:fromCents(r.pP),paidInterest:fromCents(r.pI),left:fromCents(left),status:st,paidOn:r.paidOn,daysLate:r.paidOn?daysBetween(r.due,r.paidOn):null,parts:r.parts}});

  return {rows:out,log:log,principalTotal:fromCents(sP),interestTotal:fromCents(sI),principalPaid:fromCents(pP),interestPaid:fromCents(pI),
    principalOutstanding:fromCents(sP-pP),interestRemaining:fromCents(sI-pI),remainingInstalments:fromCents(sP+sI-pP-pI),
    overpaid:fromCents(over),overdue:fromCents(overdue),next:next?{due:next.due,amount:fromCents(next.total-next.pP-next.pI)}:null,
    settlement:{min:fromCents(setMin),max:fromCents(setMin+curI)},inconsistentRows:inconsistent,paidCount:out.filter(function(r){return r.status==='paid'}).length}}
/* Periodic rate implied by the schedule: interest ÷ opening principal each row. */
function impliedPeriodRate(schedule){if(!schedule||!schedule.length)return null;var bal=sumC(schedule,function(r){return r[1]}),rates=[];
  schedule.slice().sort(function(a,b){return a[0]<b[0]?-1:1}).forEach(function(r){if(bal>0)rates.push(cents(r[2])/bal);bal-=cents(r[1])});
  var mn=Math.min.apply(null,rates),mx=Math.max.apply(null,rates);return {rate:(mn+mx)/2,min:mn,max:mx,consistent:(mx-mn)<0.0005}}
/* Daily-accrual engine (only used when the user enters a confirmed daily rate).
   compounding: 'none' (simple interest on principal) or 'daily'. Payments pay accrued interest first. */
function dailyAccrual(o){var P=cents(o.principal),rate=+o.dailyRate,last=o.startDate,acc=0,iPaid=0,pPaid=0,rows=[],comp=o.compounding==='daily';

    var toI=Math.min(a,acc);acc-=toI;a-=toI;var toP=Math.min(a,P);P-=toP;a-=toP;iPaid+=toI;pPaid+=toP;
    rows.push({date:p.date,amount:r2(p.amount),interest:fromCents(toI),principal:fromCents(toP),overpaid:fromCents(a),principalAfter:fromCents(P)})});

  while(b>0&&n<600){var i=Math.round(b*rate);if(pay<=i&&rate>0)return {never:true,months:Infinity,interest:Infinity,rows:rows};

/* Fixed instalment plan with no interest data (e.g. a debt repayment programme). */
function isOngoing(d){return d.ongoing===true||d.total==null||d.total===''}

  var firstYM=ymOf(from);if(dueDate(firstYM,day)<from)firstYM=monthAdd(firstYM,1);

  else while(left>0&&k<600&&m>0){var amt=Math.min(m,left);inst.push({ym:monthAdd(firstYM,k),due:dueDate(monthAdd(firstYM,k),day),amount:amt});left-=amt;k++}

    overdue:fromCents(sumC(rows.filter(function(r){return r.status==='overdue'}),function(r){return r.left}))};
  return {total:fromCents(total),paid:fromCents(paid),remaining:fromCents(rem),overpaid:fromCents(Math.max(0,paid-total)),rows:rows,
    next:next?{due:next.due,amount:next.left}:null,remainingCount:rows.filter(function(r){return r.status!=='paid'}).length,
    payoff:rows.length?rows[rows.length-1].due:null,overdue:fromCents(sumC(rows.filter(function(r){return r.status==='overdue'}),function(r){return r.left}))}}

function debtStatus(state,d,asOf){var pays=debtPayments(state,d).filter(function(p){return !asOf||p.date<=asOf}),terms=d.terms||{},flags=[],res={id:d.id,name:d.name,kind:d.kind,payments:pays,flags:flags};
  res.paidTotal=fromCents(sumC(pays,function(p){return p.amount}));
  if(d.kind==='card'){var bal=r2(+d.balance||0),lim=+d.limit||0;res.balance=bal;res.limit=lim;res.utilisation=lim?bal/lim:0;res.principalOutstanding=bal;
    res.dueWithSalary=terms.dueWithSalary===true;res.paidInFull=terms.paidInFull===true;
    if(!d.dueDay&&!res.dueWithSalary)flags.push('Statement due day not entered');
    if(terms.rateConfirmed!==true&&!res.paidInFull)flags.push('Card interest rate not entered (only matters if you carry a balance)');return res}
  if(d.schedule&&d.schedule.length){var a=allocateSchedule(d.schedule,pays,asOf),ir=impliedPeriodRate(d.schedule);
    Object.assign(res,{basis:'schedule',alloc:a,principalOutstanding:a.principalOutstanding,principalStart:a.principalTotal,interestPaid:a.interestPaid,
      remainingInstalments:a.remainingInstalments,interestRemaining:a.interestRemaining,next:a.next,overdue:a.overdue,overpaid:a.overpaid,

    var type=g('type').toLowerCase(),pa=parseAmount(r[ai],{allowNegative:type==='saving'}),date=g('date'),errs=[];

  clone:clone,fillDefaults:fillDefaults,ensureV2:ensureV2,migrate:migrate,applyAnswers:applyAnswers,isDefaultTerms:isDefaultTerms,fp:fp,FIX_ID:FIX_ID,applyTaxDebt:applyTaxDebt,TAX_FIX:TAX_FIX,isOngoing:isOngoing,

<script>

function saveDebt(){var g=function(i){return document.getElementById(i).value.trim()},err=document.getElementById('d_err'),nm=g('d_name'),kind=document.getElementById('d_kind').value,t=today();

/* ----- charts (hand-rolled SVG) ----- */
function paceSVG(p){
  var W=340,H=130,pl=4,pr=4,pt=24,pb=18,D=p.D,daily=new Array(D+1).fill(0);
  p.tx.forEach(function(t){if(C.classify(t)==='expense')daily[+t.date.slice(8,10)]+=+t.amount});
  var cum=[0],c=0;for(var i=1;i<=D;i++){c+=daily[i];cum.push(c)}
  var maxV=Math.max(p.B,cum[D],1)*1.04;function X(d){return pl+(W-pl-pr)*d/D}function Y(v){return pt+(H-pt-pb)*(1-v/maxV)}
  var upto=p.dayIdx,a='',area='';for(var j=0;j<=upto;j++)a+=(j?'L':'M')+X(j).toFixed(1)+' '+Y(cum[j]).toFixed(1);
  if(upto>0){area='M'+X(0)+' '+Y(0);for(var k=0;k<=upto;k++)area+='L'+X(k).toFixed(1)+' '+Y(p.B*k/D).toFixed(1);for(var q=upto;q>=0;q--)area+='L'+X(q).toFixed(1)+' '+Y(cum[q]).toFixed(1);area+='Z'}
  var over=cum[upto]>p.B*upto/D;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;margin-top:6px" role="img" aria-label="Spending pace: '+money(cum[upto])+' spent against a plan of '+money(p.plan)+'">';
  s+='<text x="'+pl+'" y="12" font-size="11" style="fill:var(--mut)">⋯ plan '+money(p.plan)+'</text><text x="'+(W-pr)+'" y="12" font-size="11" style="fill:var(--mut)" text-anchor="end">'+money(p.B)+'</text>';
  if(area)s+='<path d="'+area+'" style="fill:'+(over?'var(--area-over)':'var(--acc)')+'" opacity=".55"/>';
  s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(D)+'" y2="'+Y(p.B)+'" style="stroke:var(--plan)" stroke-width="1.6" stroke-dasharray="4 4"/>';
  if(upto>0){s+='<path d="'+a+'" fill="none" style="stroke:var(--line-act)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+X(upto)+'" cy="'+Y(cum[upto])+'" r="4.5" style="fill:var(--acc);stroke:var(--line-act)" stroke-width="1.5"/>'}
  s+='</svg><div class="row" style="font-size:11.5px;color:var(--mut);margin-top:2px"><span>01/'+pad(view.m+1)+'</span>'+(p.cur?'<b style="color:var(--ink)">today</b>':'')+'<span>'+D+'/'+pad(view.m+1)+'</span></div>';
  return s}
function flowSVG(F,opt){opt=opt||{};var days=F.days;if(!days.length)return '';
  var W=340,H=opt.h||170,pl=40,pr=8,pt=12,pb=22,n=days.length-1||1,known=F.known;
  var vals=[];days.forEach(function(d){vals.push(d.low,d.end)});if(known)vals.push(F.cash.total);var buf=known?F.buffer:0;vals.push(0);if(known&&buf)vals.push(buf);
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mx-mn<1)mx=mn+1;var span=mx-mn;mn-=span*.06;mx+=span*.06;
  function X(i){return pl+(W-pl-pr)*i/n}function Y(v){return pt+(H-pt-pb)*(1-(v-mn)/(mx-mn))}
  var pth='',ar='';days.forEach(function(d,i){pth+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(d.low).toFixed(1)+'L'+X(i).toFixed(1)+' '+Y(d.end).toFixed(1)});
  ar=pth+'L'+X(n).toFixed(1)+' '+Y(mn).toFixed(1)+'L'+X(0)+' '+Y(mn).toFixed(1)+'Z';
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block" role="img" aria-label="Projected cash balance from '+fmtShort(F.today)+' to '+fmtShort(F.to)+'. Lowest '+(known?mc(F.minBalance):'unknown')+' on '+fmtShort(F.minDate)+'">';
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);[hi,(hi+lo)/2,lo].forEach(function(v){s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(Y(v)+4)+'" font-size="10" text-anchor="end" style="fill:var(--mut)">'+(Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':Math.round(v))+'</text>'});
  s+='<path d="'+ar+'" style="fill:var(--acc)" opacity=".12"/>';
  if(known&&mn<0)s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" style="stroke:var(--red)" stroke-width="1.2"/>';
  if(known&&buf>0)s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(buf)+'" y2="'+Y(buf)+'" style="stroke:var(--warn)" stroke-width="1.2" stroke-dasharray="5 4"/>';
  s+='<path d="'+pth+'" fill="none" style="stroke:var(--acc)" stroke-width="2.4" stroke-linejoin="round"/>';
  days.forEach(function(d,i){d.events.forEach(function(e){var col=e.amount>0?'var(--acc)':(e.status==='overdue'?'var(--red)':'var(--ink)');s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(e.amount>0?d.end:d.low).toFixed(1)+'" r="3.6" style="fill:'+col+';stroke:var(--card)" stroke-width="1.5"/>'})});
  s+='<text x="'+pl+'" y="'+(H-6)+'" font-size="10" style="fill:var(--mut)">'+fmtShort(F.today)+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" font-size="10" text-anchor="end" style="fill:var(--mut)">'+fmtShort(F.to)+'</text></svg>';
  return s}
function ring(pct,label){var r=34,c=2*Math.PI*r,p=Math.max(0,Math.min(1,pct||0));return '<svg viewBox="0 0 84 84" width="84" height="84" role="img" aria-label="'+Math.round(p*100)+'% '+esc(label||'')+'"><circle cx="42" cy="42" r="'+r+'" fill="none" style="stroke:var(--track)" stroke-width="9"/><circle cx="42" cy="42" r="'+r+'" fill="none" style="stroke:var(--acc)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(c*p).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="16" font-weight="800" style="fill:var(--ink)">'+Math.round(p*100)+'%</text></svg>'}

  var old=d.id?S.tx.filter(function(x){return x.id===d.id})[0]:null;
  var t={id:d.id||uid(),ts:d.ts||Date.now(),type:d.type,amount:pa.value,date:d.date,note:(d.note||'').trim()};
  if(old){['period'].forEach(function(k){if(old[k]!==undefined)t[k]=old[k]})}

function applyCardDelta(oldT,newT){S.debts.forEach(function(d){if(d.kind!=='card')return;var delta=0;
  if(oldT&&oldT.type==='debt'&&oldT.debtId===d.id&&oldT.date>=d.from&&isFinite(+oldT.amount))delta+=+oldT.amount;
  if(newT&&newT.type==='debt'&&newT.debtId===d.id&&newT.date>=d.from)delta-=+newT.amount;
